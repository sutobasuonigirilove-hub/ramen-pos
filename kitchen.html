<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>厨房モニター</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
    }
    h1 { font-size: 22px; font-weight: 800; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }
    .card {
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 220px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .order-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
      border-bottom: 1px dashed #475569;
      padding-bottom: 6px;
    }
    .order-num {
      font-size: 36px;
      font-weight: 900;
      color: #38bdf8;
    }
    .pay-tag {
      font-size: 12px;
      background: #334155;
      padding: 2px 8px;
      border-radius: 4px;
      color: #94a3b8;
    }
    .item-list {
      list-style: none;
      margin-bottom: 14px;
    }
    .item-row {
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: bold;
      line-height: 1.3;
    }
    .opt-tag {
      font-size: 13px;
      color: #f59e0b;
      background: #451a03;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-top: 2px;
    }
    .complete-btn {
      background: #22c55e;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s, transform 0.1s;
    }
    .complete-btn:active {
      transform: scale(0.98);
      background: #16a34a;
    }
    .empty-msg {
      color: #64748b;
      font-size: 16px;
      padding: 40px 0;
      text-align: center;
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

  <header>
    <h1>🍳 厨房・調理指示</h1>
    <span style="color:#94a3b8; font-size:14px;">調理完了を押すとプレゼンターへ送られます</span>
  </header>

  <div id="orderList" class="grid"></div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD0AeO0NWqxcTYKO6aJPNJ8cNWpYGs-xvM",
      authDomain: "my-order-app-a065c.firebaseapp.com",
      projectId: "my-order-app-a065c",
      storageBucket: "my-order-app-a065c.firebasestorage.app",
      messagingSenderId: "874138476052",
      appId: "1:874138476052:web:1341a638fdd9e77fb51101"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const orderList = document.getElementById("orderList");

    // "cooking" (調理中) の注文のみをリアルタイム監視
    const q = query(collection(db, "orders"), where("status", "==", "cooking"));

    onSnapshot(q, (snapshot) => {
      orderList.innerHTML = "";
      if (snapshot.empty) {
        orderList.innerHTML = '<div class="empty-msg">調理待ちの注文はありません</div>';
        return;
      }

      snapshot.forEach((orderDoc) => {
        const data = orderDoc.data();
        const id = orderDoc.id;

        let itemsHtml = (data.items || []).map(i => {
          const opt = i.options && i.options.length > 0 ? `<div class="opt-tag">└ ${i.options.join(", ")}</div>` : "";
          return `<li class="item-row">・${i.name} ${opt}</li>`;
        }).join("");

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div>
            <div class="order-head">
              <span class="order-num">#${data.orderNumber}</span>
              <span class="pay-tag">${data.paymentMethod || "会計済"}</span>
            </div>
            <ul class="item-list">${itemsHtml}</ul>
          </div>
          <button class="complete-btn" data-id="${id}">調理完了（プレゼンターへ）</button>
        `;

        // クリックで配膳待ち（prepared）へステータス変更
        card.querySelector(".complete-btn").onclick = async () => {
          await updateDoc(doc(db, "orders", id), { status: "prepared" });
        };

        orderList.appendChild(card);
      });
    });
  </script>
</body>
</html>
